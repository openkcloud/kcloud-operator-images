# ============================================================
# release-bundle.yaml: 태그 하나로 함께 발행할 이미지·태그의 묶음 목록
# 상세: .github/workflows/publish-bundle.yml 이 `bundle/<묶음 이름>` 태그 push 를 받아
#       이 파일의 해당 묶음을 읽고 항목마다 별도 job 으로 발행한다. image 값은
#       images.yaml 의 키여야 한다(빌드 경로·Dockerfile·기본 build-arg 는 그쪽에서 온다).
#       공개 체인에서 제외된 이미지(nvidia-driver-ds)는 여기에 넣지 않는다 —
#       공개 저장소에는 그 빌드 경로가 없어 발행이 불가능하다.
# 생성일: 2026-10-03
# ============================================================
bundles:
  # 1.34 라인 설치를 막고 있는 두 이미지. operator 차트가 커맨드 인자
  #   (--generated-dp-image/--generated-dra-image)로 이 태그를 가리키는데 공개
  #   레지스트리에 발행본이 없다.
  "2026-10-03":
    - image: generic-device-plugin
      tag: v3
    - image: generic-dra-driver
      tag: v2
