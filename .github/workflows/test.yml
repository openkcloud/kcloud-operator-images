# ============================================================
# test.yml: push·PR 시 Go 모듈마다 go test 를 돌고 발행 목록 정합을 검사한다.
# 상세: 이 저장소에는 root Makefile 이 없고 발행 워크플로 둘은 docker build 만 한다. 그래서
#       Go 시험이 커밋에 함께 들어와도 아무도 부르지 않았다 — generic-dra-driver 의
#       선언 예산 가드(TestMaxDeclarationsCoversOperatorBudget)가 그 자리에 있다. 그 가드는
#       operator 저장소의 AcceleratorDescriptor MaxProperties 합을 이쪽 maxDeclarations 가
#       담는지 보며, 깨뜨릴 변경은 관측 자리(pciSysfsAttrs)를 늘리는 이쪽이므로 이쪽에서
#       돌아야 한다. 모듈마다 go.mod 의 go 지시문이 달라(1.22~1.26) matrix 로 전개하고
#       setup-go 가 그 파일에서 버전을 읽는다.
#       모듈 목록은 find . -name go.mod 의 전수다. 새 모듈을 더하면 여기도 더해야 한다 —
#       빠뜨리면 그 모듈 시험이 다시 아무도 안 부르는 자리가 된다.
#       bundle 잡은 hack/bundle-check.sh 를 돈다 — 그 스크립트도 릴리스 준비 때와 손으로
#       돌릴 때만 걸려 같은 자리에 남아 있었다. 러너에는 형제 operator 저장소가 없어
#       kernel-images 묶음 대조와 Warboy 소스 대조는 건너뜀 출력으로 빠지고, 태그 규약 표
#       대조·발행 워크플로 선택지 대조·dir/Dockerfile 실재 검사는 돈다.
# 생성일: 2026-10-05 | 수정일: 2026-10-06 (nvidia 설치기 셸 시험 잡 추가)
# ============================================================
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: go test (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      # 한 모듈이 떨어져도 나머지 결과를 본다. 모듈끼리 의존이 없다.
      fail-fast: false
      matrix:
        module:
          - furiosa-exporter
          - generic-device-plugin
          - generic-dra-driver
          - node-device-detector
          - tenstorrent-device-plugin
    steps:
      - name: Clone the code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.module }}/go.mod

      # -count=1 로 캐시를 끈다. 호스트 장치를 stat 하는 시험이 있어 캐시된 결과는
      # 그 환경을 다시 보지 않는다.
      - name: Running Tests
        working-directory: ${{ matrix.module }}
        run: go test ./... -count=1

  bundle:
    name: bundle-check
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v5

      # bundle-check.sh 는 YAML 파싱을 python3 의 PyYAML 로 한다(snap yq 가 /tmp 를 읽지
      # 못해 그렇게 돼 있다). 러너 이미지에 있는지에 기대지 않는다 — 없으면 ImportError 로
      # 검사가 하드 실패한다.
      - name: Install PyYAML
        run: sudo apt-get update -y && sudo apt-get install -y python3-yaml

      # 인자 없이 돌려 체크아웃된 작업 트리를 본다(ref 를 주면 그 ref 의 트리를 본다).
      - name: Checking the publish list
        run: bash hack/bundle-check.sh

  nvidia-installer-shell:
    name: nvidia installer shell tests
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v5

      # 공개 트리에는 driver-installer/nvidia 가 없다(라이선스 사유로 공개 체인이 제외) — 그때는 건너뛴다.
      - name: bash -n
        run: |
          if [ ! -d driver-installer/nvidia ]; then echo "skip: driver-installer/nvidia 가 이 트리에 없다"; exit 0; fi
          for f in driver-installer/nvidia/*.sh; do bash -n "$f"; done

      - name: make test
        run: |
          if [ ! -d driver-installer/nvidia ]; then echo "skip: driver-installer/nvidia 가 이 트리에 없다"; exit 0; fi
          make -C driver-installer/nvidia test
